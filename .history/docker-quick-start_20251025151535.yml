version: '3.8'

services:
  aiglass:
    build:
      context: .
      dockerfile: Dockerfile.quick
    ports:
      - "8081:8081"
    volumes:
      - ./model:/app/model
      - ./recordings:/app/recordings
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG_MODE=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - aiglass
    restart: unless-stopped

networks:
  default:
    name: aiglass-network
