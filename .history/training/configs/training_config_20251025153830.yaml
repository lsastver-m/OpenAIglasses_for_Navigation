# AI智能眼镜模型训练配置
# ========================

# 训练环境配置
environment:
  device: "cuda"  # 训练设备: cuda, cpu, auto
  workers: 8      # 数据加载线程数
  mixed_precision: true  # 混合精度训练
  cache: true     # 缓存数据集

# 数据增强配置
augmentation:
  hsv_h: 0.015    # 色调变化
  hsv_s: 0.7      # 饱和度变化
  hsv_v: 0.4      # 明度变化
  degrees: 0.0    # 旋转角度
  translate: 0.1  # 平移
  scale: 0.5      # 缩放
  shear: 0.0      # 剪切
  perspective: 0.0  # 透视变换
  flipud: 0.0     # 上下翻转
  fliplr: 0.5     # 左右翻转
  mosaic: 1.0     # 马赛克增强
  mixup: 0.0      # 混合增强
  copy_paste: 0.0 # 复制粘贴

# 模型训练配置
models:
  # 盲道分割模型
  blind_path:
    data: "datasets/blind_path/blind_path.yaml"
    model: "yolov8n-seg.pt"
    epochs: 100
    batch: 16
    imgsz: 640
    device: "cuda"
    workers: 8
    patience: 20
    save_period: 10
    description: "盲道检测和分割模型"
    
  # 斑马线检测模型
  crosswalk:
    data: "datasets/crosswalk/crosswalk.yaml"
    model: "yolov8n.pt"
    epochs: 80
    batch: 32
    imgsz: 640
    device: "cuda"
    workers: 8
    patience: 15
    save_period: 10
    description: "斑马线检测模型"
    
  # 红绿灯检测模型
  traffic_light:
    data: "datasets/traffic_light/traffic_light.yaml"
    model: "yolov8n.pt"
    epochs: 60
    batch: 24
    imgsz: 640
    device: "cuda"
    workers: 8
    patience: 10
    save_period: 10
    description: "红绿灯检测模型"
    
  # 障碍物检测模型
  obstacle:
    data: "datasets/obstacle/obstacle.yaml"
    model: "yolov8n.pt"
    epochs: 120
    batch: 20
    imgsz: 640
    device: "cuda"
    workers: 8
    patience: 25
    save_period: 15
    description: "障碍物检测模型"
    
  # 物品识别模型
  item_recognition:
    data: "datasets/items/items.yaml"
    model: "yolov8n.pt"
    epochs: 100
    batch: 24
    imgsz: 640
    device: "cuda"
    workers: 8
    patience: 20
    save_period: 10
    description: "物品识别模型"

# 训练时间预估 (小时)
total_time_hours: 45

# 硬件要求
hardware_requirements:
  gpu: "RTX 3080+ (推荐RTX 4090)"
  memory: "32GB+ RAM"
  storage: "500GB+ SSD"
  vram: "12GB+ VRAM"

# 数据集要求
dataset_requirements:
  blind_path:
    min_images: 5000
    min_annotations: 10000
    description: "盲道图像和标注"
    
  crosswalk:
    min_images: 3000
    min_annotations: 6000
    description: "斑马线图像和标注"
    
  traffic_light:
    min_images: 2000
    min_annotations: 4000
    description: "红绿灯图像和标注"
    
  obstacle:
    min_images: 10000
    min_annotations: 20000
    description: "障碍物图像和标注"
    
  item_recognition:
    min_images: 8000
    min_annotations: 16000
    description: "物品图像和标注"

# 模型导出配置
export:
  formats: ["onnx", "torchscript", "tensorrt"]
  optimize: true
  imgsz: 640
  device: "cuda"

# 部署配置
deployment:
  output_dir: "deployment/models"
  create_package: true
  include_config: true
  version: "2.4"
